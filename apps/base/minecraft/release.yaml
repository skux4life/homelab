apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft-stack
  namespace: minecraft
spec:
  interval: 10m
  chart:
    spec:
      chart: minecraft
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: minecraft-stack
        namespace: minecraft
      interval: 12h

  valuesFrom:
    - kind: Secret
      name: minecraft-values
      valuesKey: whitelist
      targetPath: minecraftServer.whitelist
    - kind: Secret
      name: minecraft-values
      valuesKey: ops
      targetPath: minecraftServer.ops

  values:
    replicaCount: 1
    minecraftServer:
      eula: "TRUE"
      type: "MODRINTH"
      version: "1.21.1"
      memory: "8G"
      # serviceType: ClusterIP
      serviceType: NodePort
      nodePort: 30555
      gameMode: survival
      difficulty: peaceful

      # Required JVM optimizations for NeoForge + heavy physics mods
      jvmOpts: "-XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200"

      resources:
        requests:
          cpu: "2000m"
          memory: "8Gi"
        limits:
          cpu: "6000m"
          memory: "10Gi"
    extraEnv:
      # MOD_PLATFORM: "MODRINTH"
      MODRINTH_LOADER: "neoforge"
      MODRINTH_MODPACK: "https://modrinth.com/modpack/create_plus/version/6.0.0-alpha-f"
      MODRINTH_FORCE_SYNCHRONIZE: "true"
      MODRINTH_EXCLUDE_FILES: "statuseffectbars"
      MODRINTH_PROJECTS: "neoforge:create-easy-structures,neoforge:create-diesel-generators,neoforge:create-stuff-additions,neoforge:create-stuff-n-additions-x-sable-aeronautics-compat:1.0.3,neoforge:create-stuff-and-addition-tank-fix"

    persistence:
      dataDir:
        enabled: true
        storageClass: "local-path"
        accessMode: ReadWriteOnce
        size: 10Gi
